name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

      - name: Generate Code Coverage
        run: go test -v -tags test -coverprofile=coverage.txt -covermode=count $(go list ./...)

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: goboilerplate:api