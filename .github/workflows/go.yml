name: Go

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - main

env:
  GCP_PROJECT_ID: ${{ vars.PROJECT_ID }}
  GAR_LOCATION: "asia-southeast1"
  GAR_REPOSITORY: "goboilerplate"
  IMAGE_NAME: "goboilerplate-api"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v7

      # ---------------------------------------------------------
      # Go
      # ---------------------------------------------------------

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

      - name: Generate Code Coverage
        run: |
          go test -v \
            -tags test \
            -coverprofile=coverage.txt \
            -covermode=count \
            $(go list ./...)

      # ---------------------------------------------------------
      # Docker
      # ---------------------------------------------------------

      - name: Set up QEMU
        if: github.event_name == 'push' && vars.PROJECT_ID != ''
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && vars.PROJECT_ID != ''
        uses: docker/setup-buildx-action@v4

      # ---------------------------------------------------------
      # Google Cloud Authentication
      #
      # Only authenticate when:
      #   1. This is a push
      #   2. PROJECT_ID is configured
      #
      # Pull requests and repositories without PROJECT_ID
      # skip Google Cloud completely.
      # ---------------------------------------------------------

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && vars.PROJECT_ID != ''
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.IDP }}
          service_account: github-actions@${{ vars.PROJECT_ID }}.iam.gserviceaccount.com

      # ---------------------------------------------------------
      # Docker authentication
      # ---------------------------------------------------------

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push' && vars.PROJECT_ID != ''
        run: |
          gcloud auth configure-docker \
            ${{ env.GAR_LOCATION }}-docker.pkg.dev \
            --quiet

      # ---------------------------------------------------------
      # Docker image metadata
      # ---------------------------------------------------------

      - name: Extract Docker metadata
        if: github.event_name == 'push' && vars.PROJECT_ID != ''
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}

          tags: |
            # Git SHA
            type=sha,prefix=,format=long

            # latest for main branch
            type=raw,value=latest,enable={{is_default_branch}}

            # Semantic version from Git tag
            # v1.2.3 -> v1.2.3
            type=ref,event=tag

      # ---------------------------------------------------------
      # Build and Push Docker image
      # ---------------------------------------------------------

      - name: Build and Push Docker image
        if: github.event_name == 'push' && vars.PROJECT_ID != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile

          platforms: |
            linux/amd64
            linux/arm64

          push: true

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------
      # Skip GAR notification
      # ---------------------------------------------------------

      - name: Skip GAR push
        if: github.event_name == 'push' && vars.PROJECT_ID == ''
        run: |
          echo "PROJECT_ID is not configured."
          echo "Skipping Google Artifact Registry image push."